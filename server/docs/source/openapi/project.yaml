info:
  title: projects
  description: >-
    Project requests

tags:
  - name: Request
    description: Project requests

paths:
  /projects/requests:
    post:
      tags:
        - Request
      summary: Create a project request
      description: >-
        Request submission; does not create a project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectTemplate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          description: Payload validation failed
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
        "500":
          description: SMTP error

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  responses:
    UnauthorizedError:
      $ref: "_common.yaml#/components/responses/UnauthorizedError"
    UnprocessableContentError:
      $ref: "_common.yaml#/components/responses/UnprocessableContentError"
  schemas:
    Request:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: Identifies the request for review
    ProjectTemplate:
      type: object
      required:
        - title
        - summary
        - contact_name
        - contact_institution
        - contact_email
        - date_published
        - external_sources
        - metadata
      properties:
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        contact_name:
          type: string
          maxLength: 128
        contact_institution:
          type: string
          maxLength: 255
        contact_email:
          type: string
          format: email
        date_published:
          type: string
          format: date-time
          nullable: true
        external_sources:
          type: array
          minItems: 1
          items:
            type: object
            description: At least one of 'doi' or 'pmid' is required
            properties:
              doi:
                type: string
                nullable: true
              pmid:
                type: integer
                nullable: true
        metadata:
          type: array
          minItems: 1
          items:
            type: object
            required: [rna, modomics_id, tech, method_id, note, organism]
            properties:
              rna:
                type: string
                maxLength: 32
              modomics_id:
                type: string
                maxLength: 128
              tech:
                type: string
                maxLength: 255
              method_id:
                type: string
                maxLength: 8
              note:
                type: string
                nullable: true
              organism:
                type: object
                required: [taxa_id, cto, assembly_name, assembly_id]
                properties:
                  taxa_id:
                    type: integer
                  cto:
                    type: string
                    maxLength: 255
                  assembly_name:
                    type: string
                    maxLength: 128
                  assembly_id:
                    type: integer
                    nullable: true
