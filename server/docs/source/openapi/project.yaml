info:
  title: projects
  description: >-
    Project access and requests

tags:
  - name: Browse
    description: Projects metadata
  - name: Request
    description: Project requests

paths:
  /projects:
    get:
      tags:
        - Browse
      summary: Get projects
      description: >-
        Sci-ModoM's Browse interface
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /users/me/projects:
    get:
      tags:
        - Browse
      summary: Get projects per user
      description: >-
        Projects added after a request submission; these projects
        remain associated with the current user, who gains permission to
        upload datasets and modify attachments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "_common.yaml#/components/responses/UnauthorizedError"
        "422":
          $ref: "_common.yaml#/components/responses/UnauthorizedErrorContent"
  /projects/requests:
    post:
      tags:
        - Request
      summary: Create a project request
      description: >-
        Request submitted for internal review; does not create a project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectTemplate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          description: Malformed request body or template validation failed
        "401":
          $ref: "_common.yaml#/components/responses/UnauthorizedError"
        "422":
          $ref: "_common.yaml#/components/responses/UnauthorizedErrorContent"
        "500":
          description: Request created, but notification failed

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  schemas:
    Project:
      type: array
      items:
        type: object
        properties:
          contact_institution:
            type: string
            description: >-
              The institution or affiliation of `contact_name`
          contact_name:
            type: string
            description: >-
              The author of the data or a contact person responsible for adding the data
          date_added:
            type: integer
            description: >-
              POSIX timestamp corresponding to the date the project was added. In
              Sci-ModoM (UI), this is converted to YYYY-MM-DD (ISO 8601).
          date_published:
            type: integer
            description: >-
              POSIX timestamp corresponding to the date of publication. In
              Sci-ModoM (UI), this is converted to YYYY-MM-DD (ISO 8601).
          doi:
            type: string
            description: A list of DOIs associated with this project
          pmid:
            type: string
            description: A list of PMIDs associated with this project
          project_id:
            type: string
            description: Project identifier (SMID)
          project_summary:
            type: string
            description: Project summary
          project_title:
            type: string
            description: Project title
    Request:
      type: object
      properties:
        request_id:
          type: string
          description: Identifies the request for internal review
    ProjectTemplate:
      type: object
      required:
        - title
        - summary
        - contact_name
        - contact_institution
        - contact_email
        - external_sources
        - metadata
      properties:
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        contact_name:
          type: string
          maxLength: 128
        contact_institution:
          type: string
          maxLength: 255
        contact_email:
          type: string
          format: email
        date_published:
          type: string
          format: date-time
          nullable: true
        external_sources:
          type: array
          minItems: 1
          items:
            type: object
            description: At least one of 'doi' or 'pmid' is required
            properties:
              doi:
                type: string
                maxLength: 255
              pmid:
                type: integer
        metadata:
          type: array
          minItems: 1
          items:
            type: object
            required: [rna, modomics_id, tech, method_id, organism]
            properties:
              rna:
                type: string
                maxLength: 32
              modomics_id:
                type: string
                maxLength: 128
              tech:
                type: string
                maxLength: 255
              method_id:
                type: string
                maxLength: 8
              note:
                type: string
                nullable: true
              organism:
                type: object
                required: [taxa_id, cto, assembly_name]
                properties:
                  taxa_id:
                    type: integer
                  cto:
                    type: string
                    maxLength: 255
                  assembly_name:
                    type: string
                    maxLength: 128
                  assembly_id:
                    type: integer
                    nullable: true
