info:
  title: Transfer REST API
  description: >-
    File transfer endpoints. `POST /transfer/tmp_upload` is deliberately
    unauthenticated, since it also backs the public, anonymous dataset
    comparison feature under `/dataset/{intersect,closest,subtract}`.
    Uploaded files are temporary and size-limited; do not rely on them
    for persistent storage.

paths:
  /transfer/dataset/{dataset_id}:
    get:
      summary: Export a dataset as CSV
      parameters:
        - in: path
          name: dataset_id
          required: true
          schema:
            type: string
          description: EUFID
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Unknown dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfer/tmp_upload:
    post:
      summary: Upload a temporary file
      description: >-
        Upload a file (e.g. a BED/bedRMod file for dataset comparison, or
        a bedRMod file to later import via `POST /management/dataset`)
        and receive an opaque `file_id` to reference it in a subsequent
        request. No authentication is required. Files are subject to a
        50 MiB size limit. In the reference Docker deployment, files
        under this endpoint's storage path are deleted automatically
        after 60 minutes (see `mini_cron.sh`); do not rely on them for
        anything longer-lived than an in-progress upload/import/compare
        workflow.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
        "413":
          description: File exceeds the maximum allowed size (50 MiB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      $ref: "_common.yaml#/components/schemas/Error"
