info:
  title: Modification REST API

paths:
  /modifications/records:
    get:
      summary: Get modification records
      description: >-
        Query modification data records "by source" (modification, organism,
        technology) or "by gene" (set `by=gene`). Add `format=csv` to
        download the result as CSV instead of JSON.


        `geneName` and `chrom` are mutually exclusive. For "by source"
        queries, `chrom` (with optional `chromStart`/`chromEnd`) or
        `geneName` are optional extra filters. For "by gene" queries, one of
        `geneName` or `chrom` is required; if `chrom` is used, `chromStart`
        and `chromEnd` are required too.
      parameters:
        - $ref: "#/components/parameters/byQueryParam"
        - $ref: "#/components/parameters/formatQueryParam"
        - $ref: "#/components/parameters/rnaTypeQueryParam"
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/modificationQueryParam"
        - $ref: "#/components/parameters/organismQueryParam"
        - $ref: "#/components/parameters/technologyQueryParam"
        - $ref: "#/components/parameters/geneNameQueryParam"
        - $ref: "#/components/parameters/biotypesQueryParam"
        - $ref: "#/components/parameters/featuresQueryParam"
        - $ref: "#/components/parameters/chromQueryParam"
        - $ref: "#/components/parameters/chromStartQueryParam"
        - $ref: "#/components/parameters/chromEndQueryParam"
        - $ref: "#/components/parameters/multiSortQueryParam"
        - $ref: "#/components/parameters/firstRecordQueryParam"
        - $ref: "#/components/parameters/maxRecordsQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
            text/csv:
              schema:
                type: string
                description: Present only when `format=csv` is given
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "501":
          $ref: "#/components/responses/ClientResponseException501"
  /modifications/records/summary:
    get:
      summary: Get count of modification records
      description: Total number of modification data records
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
  /modifications/sites:
    get:
      summary: Get modification site
      description: Get information related to a modification site
      parameters:
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/chromSimpleQueryParam"
        - $ref: "#/components/parameters/startQueryParam"
        - $ref: "#/components/parameters/endQueryParam"
        - $ref: "#/components/parameters/strandQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
  /modifications/sites/summary:
    get:
      summary: Get count of modification sites
      description: Total number of modification sites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
  /modifications/sites/context:
    get:
      summary: Get genomic context
      description: Get genomic context centered on a modification site
      parameters:
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/chromSimpleQueryParam"
        - $ref: "#/components/parameters/startQueryParam"
        - $ref: "#/components/parameters/endQueryParam"
        - $ref: "#/components/parameters/strandQueryParam"
        - $ref: "#/components/parameters/windowQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
  /modifications/sites/targets:
    get:
      summary: Get interactome-relevant information
      description: >-
        Get information related to miRNA target and RBP binding sites
        that may be affected by a modification site
      parameters:
        - $ref: "#/components/parameters/targetQueryParam"
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/chromSimpleQueryParam"
        - $ref: "#/components/parameters/startQueryParam"
        - $ref: "#/components/parameters/endQueryParam"
        - $ref: "#/components/parameters/strandQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BED6"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"

components:
  parameters:
    byQueryParam:
      in: query
      name: by
      required: false
      schema:
        type: string
        enum:
          - "gene"
      description: >-
        Switch `/records` from a "by source" query (default) to a "by
        gene" query
    formatQueryParam:
      in: query
      name: format
      required: false
      schema:
        type: string
        enum:
          - "csv"
      description: Return the records as a CSV file instead of JSON
    rnaTypeQueryParam:
      in: query
      name: rnaType
      required: true
      schema:
        type: string
      description: A valid RNA type (currently only `WTS`)
    taxaIdQueryParam:
      in: query
      name: taxaId
      required: true
      schema:
        type: integer
      description: A valid NCBI taxonomic identifier
    modificationQueryParam:
      in: query
      name: modification
      required: false # required unless by=gene
      schema:
        type: integer
      description: >-
        Sci-ModoM's modification identifier. Required for "by source"
        queries (`by` unset)
    organismQueryParam:
      in: query
      name: organism
      required: false # required unless by=gene
      schema:
        type: integer
      description: >-
        Sci-ModoM's organism identifier. Required for "by source"
        queries (`by` unset)
    technologyQueryParam:
      in: query
      name: technology
      required: false # required unless by=gene
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: >-
        Sci-ModoM's technology identifier(s). Required for "by source"
        queries (`by` unset)
    geneNameQueryParam:
      in: query
      name: geneName
      required: false
      schema:
        type: string
      description: >-
        Exact gene name match. Mutually exclusive with `chrom`; for "by
        gene" queries (`by=gene`), one of `geneName` or `chrom` is required
    biotypesQueryParam:
      in: query
      name: biotypes
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: Gene biotype(s) to filter on
    featuresQueryParam:
      in: query
      name: features
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: Genomic feature(s) to filter on, e.g. `Exonic`, `Intronic`
    multiSortQueryParam:
      in: query
      name: multiSort
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: e.g. `coverage%2Bdesc`
    chromQueryParam:
      in: query
      name: chrom
      required: false
      schema:
        type: string
      description: >-
        Mutually exclusive with `geneName`. Required together with
        `chromStart`/`chromEnd` for "by gene" queries (`by=gene`)
    chromStartQueryParam:
      in: query
      name: chromStart
      required: false
      schema:
        type: integer
    chromEndQueryParam:
      in: query
      name: chromEnd
      required: false
      schema:
        type: integer
    chromSimpleQueryParam:
      in: query
      name: chrom
      required: true
      schema:
        type: string
    startQueryParam:
      in: query
      name: start
      required: true
      schema:
        type: integer
    endQueryParam:
      in: query
      name: end
      required: true
      schema:
        type: integer
    strandQueryParam:
      in: query
      name: strand
      required: false
      schema:
        type: string
        enum:
          - "+"
          - "-"
          - "."
        default: "."
    windowQueryParam:
      in: query
      name: window
      required: true
      schema:
        type: integer
      description: Number of bases to include on each side of the site
    targetQueryParam:
      in: query
      name: target
      required: true
      schema:
        type: string
        enum:
          - "MIRNA"
          - "RBP"
      description: miRNA targets or RBP binding sites
    firstRecordQueryParam:
      in: query
      name: firstRecord
      required: false
      schema:
        type: integer
    maxRecordsQueryParam:
      in: query
      name: maxRecords
      required: false
      schema:
        type: integer
  responses:
    ClientResponseException400:
      description: Bad Request
    ClientResponseException404:
      description: Unrecognized parameter value
    ClientResponseException501:
      description: Not Implemented
  schemas:
    Count:
      type: object
      properties:
        count:
          type: integer
          description: Number of matching records
    BED6:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              chrom:
                type: string
                description: Chromosome name
              start:
                type: integer
                description: Feature start position
              end:
                type: integer
                description: Feature end position
              name:
                type: string
                description: Feature name
              score:
                type: integer
                description: Feature score
              strand:
                type: string
                description: Feature strand
    Search:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              chrom:
                type: string
                description: Chromosome name
              start:
                type: integer
                description: Feature start position
              end:
                type: integer
                description: Feature end position
              name:
                type: string
                description: Feature name (MODOMICS short name)
              score:
                type: integer
                description: Feature confidence (valid coverage or coverage)
              strand:
                type: string
                description: Feature strand
              coverage:
                type: integer
                description: Feature coverage
              frequency:
                type: number
                description: Feature frequency (percentage of modification)
              reference_id:
                type: integer
                description: MODOMICS reference identifier for this modification
              tech:
                type: string
                description: Detection technology
              taxa_id:
                type: integer
                description: NCBI's taxonomic identifier
              cto:
                type: string
                description: Cell, tissue, or organism
              gene_id:
                type: string
                description: Gene identifier
              gene_name:
                type: string
                description: Gene name
              gene_biotype:
                type: string
                description: Gene biotype
              feature:
                type: string
                description: Gene feature
              id:
                type: integer
                description: Data id
              dataset_id:
                type: integer
                description: EUFID
        totalRecords:
          type: integer
          description: Total number of records matching the query
    Site:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              chrom:
                type: string
                description: Chromosome name
              start:
                type: integer
                description: Feature start position
              end:
                type: integer
                description: Feature end position
              name:
                type: string
                description: Feature name (MODOMICS short name)
              score:
                type: integer
                description: Feature confidence (valid coverage or coverage)
              strand:
                type: string
                description: Feature strand
              coverage:
                type: integer
                description: Feature coverage
              frequency:
                type: number
                description: Feature frequency (percentage of modification)
              rna:
                type: string
                description: RNA type
              reference_id:
                type: integer
                description: MODOMICS reference identifier for this modification
              modification_id:
                type: integer
                description: Sci-ModoM's modification identifier
              short_name:
                type: string
                description: Modification short name (MODOMICS)
              tech:
                type: string
                description: Detection technology
              cto:
                type: string
                description: Cell, tissue, or organism
              dataset_id:
                type: integer
                description: EUFID
    Context:
      type: object
      properties:
        context:
          type: string
          description: Sequence context centered on modification
