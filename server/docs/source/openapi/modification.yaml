info:
  title: modifications
  description: >-
    Modification records and sites.

tags:
  - name: Record
    description: Modification records
  - name: Site
    description: Modification sites

paths:
  /modifications/records:
    get:
      tags:
        - Record
      summary: Get modification records
      description: >-
        Sci-ModoM's Search interface.
        `geneName` and `chrom` are mutually exclusive, and required
        when `by=gene`, else `modification`, `organism`, and `technology` are required.
        Add `format=csv` to download the result as CSV
      parameters:
        - $ref: "#/components/parameters/byQueryParam"
        - $ref: "#/components/parameters/formatQueryParam"
        - $ref: "#/components/parameters/rnaTypeQueryParam"
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/modificationQueryParam"
        - $ref: "#/components/parameters/organismQueryParam"
        - $ref: "#/components/parameters/technologyQueryParam"
        - $ref: "#/components/parameters/geneNameQueryParam"
        - $ref: "#/components/parameters/biotypesQueryParam"
        - $ref: "#/components/parameters/featuresQueryParam"
        - $ref: "#/components/parameters/chromQueryParam"
        - $ref: "#/components/parameters/chromStartQueryParam"
        - $ref: "#/components/parameters/chromEndQueryParam"
        - $ref: "#/components/parameters/multiSortQueryParam"
        - $ref: "#/components/parameters/firstRecordQueryParam"
        - $ref: "#/components/parameters/maxRecordsQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
            text/csv:
              schema:
                type: string
                description: >-
                  CSV with header row: chrom, chromStart, chromEnd, name, score,
                  strand, coverage, frequency, EUFID, Technology, Organism,
                  Cell/Tissue, Feature, Gene, Biotype
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "501":
          $ref: "#/components/responses/ClientResponseException501"
  /modifications/records/summary:
    get:
      tags:
        - Record
      summary: Get count of modification records
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
  /modifications/sites:
    get:
      tags:
        - Site
      summary: Get modification site
      parameters:
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/chromSimpleQueryParam"
        - $ref: "#/components/parameters/startQueryParam"
        - $ref: "#/components/parameters/endQueryParam"
        - $ref: "#/components/parameters/strandQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
  /modifications/sites/summary:
    get:
      tags:
        - Site
      summary: Get count of modification sites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
  /modifications/sites/context:
    get:
      tags:
        - Site
      summary: Get genomic context
      description: Genomic sequence context centered on a modification site
      parameters:
        - $ref: "#/components/parameters/windowQueryParam"
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/chromSimpleQueryParam"
        - $ref: "#/components/parameters/startQueryParam"
        - $ref: "#/components/parameters/endQueryParam"
        - $ref: "#/components/parameters/strandQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
  /modifications/sites/targets:
    get:
      tags:
        - Site
      summary: Get interactome information
      description: >-
        miRNA targets and RBP binding sites
        that may be affected by a modification site
      parameters:
        - $ref: "#/components/parameters/targetQueryParam"
        - $ref: "#/components/parameters/taxaIdQueryParam"
        - $ref: "#/components/parameters/chromSimpleQueryParam"
        - $ref: "#/components/parameters/startQueryParam"
        - $ref: "#/components/parameters/endQueryParam"
        - $ref: "#/components/parameters/strandQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BED6"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"

components:
  parameters:
    byQueryParam:
      in: query
      name: by
      required: false
      schema:
        type: string
        enum:
          - "gene"
      description: >-
        Switch `/records` from a "Modification" query (default) to a "Gene/Chrom" query
    formatQueryParam:
      in: query
      name: format
      required: false
      schema:
        type: string
        enum:
          - "csv"
      description: Return the records as a CSV file
    rnaTypeQueryParam:
      in: query
      name: rnaType
      required: true
      schema:
        type: string
      description: A valid RNA type
    taxaIdQueryParam:
      in: query
      name: taxaId
      required: true
      schema:
        type: integer
      description: A valid NCBI taxon
    modificationQueryParam:
      in: query
      name: modification
      required: false # required unless by=gene
      schema:
        type: integer
      description: >-
        Sci-ModoM's modification identifier (MODOMICS code, `rna`).
        Required unless `by=gene`
    organismQueryParam:
      in: query
      name: organism
      required: false # required unless by=gene
      schema:
        type: integer
      description: >-
        Sci-ModoM's organism identifier (`taxa_id`, `cto`).
        Required unless `by=gene`
    technologyQueryParam:
      in: query
      name: technology
      required: false # required unless by=gene
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
      description: >-
        Sci-ModoM's technology identifier(s) (`meth`, `tech`).
        Required unless `by=gene`
    geneNameQueryParam:
      in: query
      name: geneName
      required: false
      schema:
        type: string
      description: >-
        Exact gene name match. Mutually exclusive with `chrom`;
        if `by=gene`, one of `geneName` or `chrom` is required
    biotypesQueryParam:
      in: query
      name: biotypes
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: Gene biotype(s) to filter on
    featuresQueryParam:
      in: query
      name: features
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: Genomic feature(s) to filter on
    multiSortQueryParam:
      in: query
      name: multiSort
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: >-
        Sort query in ascending `asc` or descending `desc` order,
        by `chrom`, `start`, `score`, `coverage`, or `frequency`, e.g.
        `chrom%2Basc`
    chromQueryParam:
      in: query
      name: chrom
      required: false
      schema:
        type: string
      description: >-
        Mutually exclusive with `geneName`. If `by=gene`,
        one of `geneName` or `chrom` is required
    chromStartQueryParam:
      in: query
      name: chromStart
      required: false
      schema:
        type: integer
      description: >-
        If `by=gene`, `chrom` is required
    chromEndQueryParam:
      in: query
      name: chromEnd
      required: false
      schema:
        type: integer
      description: >-
        If `by=gene`, `chrom` and `chromStart` are required
    chromSimpleQueryParam:
      in: query
      name: chrom
      required: true
      schema:
        type: string
    startQueryParam:
      in: query
      name: start
      required: true
      schema:
        type: integer
    endQueryParam:
      in: query
      name: end
      required: true
      schema:
        type: integer
    strandQueryParam:
      in: query
      name: strand
      required: false
      schema:
        type: string
        enum:
          - "+"
          - "-"
          - "."
        default: "."
    windowQueryParam:
      in: query
      name: window
      required: true
      schema:
        type: integer
      description: Number of bases to include on each side of the site
    targetQueryParam:
      in: query
      name: target
      required: true
      schema:
        type: string
        enum:
          - "MIRNA"
          - "RBP"
      description: miRNA targets or RBP binding sites
    firstRecordQueryParam:
      in: query
      name: firstRecord
      required: false
      schema:
        type: integer
      description: offset
    maxRecordsQueryParam:
      in: query
      name: maxRecords
      required: false
      schema:
        type: integer
      description: limit
  responses:
    ClientResponseException400:
      description: Bad request
    ClientResponseException404:
      description: Parameter not found
    ClientResponseException501:
      description: Not Implemented
  schemas:
    Count:
      type: object
      properties:
        count:
          type: integer
          description: Number of data records or sites
    BED6:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              chrom:
                type: string
                description: Chromosome name
              start:
                type: integer
                description: Feature start position
              end:
                type: integer
                description: Feature end position
              name:
                type: string
                description: Feature name
              score:
                type: integer
                description: Feature score
              strand:
                type: string
                description: Feature strand
    Search:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              chrom:
                type: string
                description: Chromosome name
              start:
                type: integer
                description: Feature start position
              end:
                type: integer
                description: Feature end position
              name:
                type: string
                description: Feature name (MODOMICS short name)
              score:
                type: integer
                description: Feature confidence (valid coverage or coverage)
              strand:
                type: string
                description: Feature strand
              coverage:
                type: integer
                description: Feature coverage
              frequency:
                type: number
                description: Feature frequency (percentage of modification)
              reference_id:
                type: integer
                description: MODOMICS reference identifier for this modification
              tech:
                type: string
                description: Detection technology
              taxa_id:
                type: integer
                description: NCBI taxon
              cto:
                type: string
                description: Cell, tissue, or organism
              gene_id:
                type: string
                description: Gene identifier
              gene_name:
                type: string
                description: Gene name
              gene_biotype:
                type: string
                description: Gene biotype
              feature:
                type: string
                description: Gene feature
              id:
                type: integer
                description: Data record identifier
              dataset_id:
                type: string
                description: Dataset identifier (EUFID)
        totalRecords:
          type: integer
          description: Total number of records matching the query
    Site:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              chrom:
                type: string
                description: Chromosome name
              start:
                type: integer
                description: Feature start position
              end:
                type: integer
                description: Feature end position
              name:
                type: string
                description: Feature name (MODOMICS short name)
              score:
                type: integer
                description: Feature confidence (valid coverage or coverage)
              strand:
                type: string
                description: Feature strand
              coverage:
                type: integer
                description: Feature coverage
              frequency:
                type: number
                description: Feature frequency (percentage of modification)
              rna:
                type: string
                description: RNA type
              reference_id:
                type: integer
                description: MODOMICS reference identifier for this modification
              modification_id:
                type: integer
                description: Sci-ModoM's modification identifier (MODOMICS code, `rna`)
              short_name:
                type: string
                description: Modification short name (MODOMICS)
              tech:
                type: string
                description: Detection technology
              cto:
                type: string
                description: Cell, tissue, or organism
              dataset_id:
                type: integer
                description: Dataset identifier (EUFID)
    Context:
      type: object
      properties:
        context:
          type: string
          description: Sequence context centered on modification
