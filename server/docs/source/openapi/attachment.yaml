info:
  title: datasets
  description: >-
    Dataset attachments

tags:
  - name: BAM
    description: BAM file attachments

paths:
  /datasets/{dataset_id}/attachments/bams:
    get:
      tags:
        - BAM
      summary: Get dataset BAM file attachment metadata
      parameters:
        - $ref: "#/components/parameters/datasetIdPathParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BamFileList"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
  /datasets/{dataset_id}/attachments/bams/{name}:
    get:
      tags:
        - BAM
      summary: Download dataset BAM file
      parameters:
        - $ref: "#/components/parameters/datasetIdPathParam"
        - $ref: "#/components/parameters/nameBamPathParam"
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
    put:
      tags:
        - BAM
      summary: Upload (create or replace) a BAM file
      description: >-
        Attach a BAM file to a dataset. If a BAM file with the given
        `name` already exists for this dataset, it is replaced (204);
        otherwise a new attachment is created (201). The raw request
        body is streamed to storage. A file size limit may apply.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/datasetIdPathParam"
        - $ref: "#/components/parameters/nameBamPathParam"
      requestBody:
        required: true
        description: Raw BAM file content
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BamCreated"
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "413":
          $ref: "#/components/responses/TooLargeError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
    delete:
      tags:
        - BAM
      summary: Remove a BAM file
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/datasetIdPathParam"
        - $ref: "#/components/parameters/nameBamPathParam"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  parameters:
    datasetIdPathParam:
      in: path
      name: dataset_id
      required: true
      schema:
        type: string
      description: Dataset identifier (EUFID)
    nameBamPathParam:
      in: path
      name: name
      required: true
      schema:
        type: string
      description: BAM file attachment (original file) name
  responses:
    ClientResponseException400:
      description: Invalid dataset identifier or BAM file name
    ClientResponseException404:
      description: >-
        Dataset identifier or BAM file name not found,
        BAM file is not an attachment of this dataset
    UnauthorizedError:
      $ref: "_common.yaml#/components/responses/UnauthorizedError"
    ForbiddenError:
      $ref: "_common.yaml#/components/responses/ForbiddenError"
    TooLargeError:
      $ref: "_common.yaml#/components/responses/TooLargeError"
    UnprocessableContentError:
      $ref: "_common.yaml#/components/responses/UnprocessableContentError"
  schemas:
    BamCreated:
      type: object
      required:
        - original_file_name
      properties:
        original_file_name:
          type: string
          description: Name of the newly created BAM file attachment
    BamFileList:
      type: array
      items:
        type: object
        required:
          - original_file_name
          - size_in_bytes
          - mtime_epoch
        properties:
          original_file_name:
            type: string
            description: Original file name
          size_in_bytes:
            type: integer
            description: File size in bytes
          mtime_epoch:
            type: number
            description: >-
              Time of last modification
