info:
  title: datasets
  description: >-
    Dataset access and upload

tags:
  - name: Dataset
    description: Dataset metadata, import and export
  - name: Permission
    description: Dataset permissions

paths:
  /datasets:
    get:
      tags:
        - Dataset
      summary: Get dataset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
    post:
      tags:
        - Dataset
      summary: Add dataset and import data
      description: >-
        Import a previously uploaded bedRMod file (see
        `POST /uploads`) into an existing project. The caller
        must be associated with the target project's SMID.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDatasetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetCreated"
        "400":
          description: Payload validation failed
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Parameter not found
        "409":
          description: A dataset with the same content already exists
        "422":
          description: >-
            The upload was rejected during import (euf-specs).
            Also returned for a malformed or expired JWT
        "500":
          description: Liftover failed
        "501":
          description: RNA type annotation not implemented
  /users/me/datasets:
    get:
      tags:
        - Dataset
      summary: Get dataset per user
      description: >-
        Dataset submitted by the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
  /datasets/summary:
    get:
      tags:
        - Dataset
      summary: Get dataset count
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
  /datasets/{dataset_id}/bedrmod:
    get:
      tags:
        - Dataset
      summary: Export dataset as bedRMod
      parameters:
        - in: path
          name: dataset_id
          required: true
          schema:
            type: string
          description: Dataset identifier (EUFID)
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
                description: Consult the euf-specs for more information
        "404":
          description: Dataset not found
  /users/me/datasets/{dataset_id}/permissions:
    get:
      tags:
        - Permission
      summary: Get user dataset permissions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: dataset_id
          required: true
          schema:
            type: string
          description: Dataset identifier (EUFID)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Dataset not found
        "422":
          $ref: "#/components/responses/UnprocessableContentError"

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  responses:
    UnauthorizedError:
      $ref: "_common.yaml#/components/responses/UnauthorizedError"
    ForbiddenError:
      $ref: "_common.yaml#/components/responses/ForbiddenError"
    UnprocessableContentError:
      $ref: "_common.yaml#/components/responses/UnprocessableContentError"
  schemas:
    AddDatasetBody:
      type: object
      required:
        - smid
        - file_id
        - rna_type
        - title
        - assembly_id
        - modification_id
        - organism_id
        - technology_id
      properties:
        smid:
          type: string
          description: Project SMID the dataset will be added to
        file_id:
          type: string
          description: >-
            Identifier returned by `POST /uploads` for the
            bedRMod file to import
        rna_type:
          type: string
          description: >-
            One of the RNA type IDs returned by `GET /catalogs/rna-types`
        title:
          type: string
          maxLength: 255
        assembly_id:
          type: integer
          description: Assembly identifier
        modification_id:
          description: One or more modification identifiers
          type: array
          minItems: 1
          items:
            type: integer
        organism_id:
          type: integer
          description: Organism identifier
        technology_id:
          type: integer
          description: Technology identifier
    DatasetCreated:
      type: object
      required:
        - dataset_id
      properties:
        dataset_id:
          type: string
          description: Newly created dataset identifier (EUFID)
    Count:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: Number of dataset
    Dataset:
      type: array
      items:
        type: object
        description: >-
          Dataset metadata; use GET /projects to look up
          related project details
        required:
          - basecalling
          - bioinformatics_workflow
          - cto
          - dataset_id
          - dataset_title
          - experiment
          - external_source
          - modification_type
          - modifications
          - project_id
          - rna
          - sequencing_platform
          - taxa_id
          - taxa_sname
          - tech
        properties:
          basecalling:
            type: string
            nullable: true
            description: Basecalling model information (euf-specs)
          bioinformatics_workflow:
            type: string
            nullable: true
            description: >-
              Link to bioinformatics workflow (euf-specs)
          cto:
            type: string
            description: Cell, tissue, or organism
          dataset_id:
            type: string
            description: Dataset identifier (EUFID)
          dataset_title:
            type: string
            description: Dataset title
          experiment:
            type: string
            nullable: true
            description: >-
              Information about or link to experimental protocol
              and design (euf-specs)
          external_source:
            type: string
            nullable: true
            description: >-
              Free-text reference to an external source (euf-specs)
          modification_type:
            type: string
            # enum:
            description: >-
              RNA type (euf-specs) - currently not the same as `rna`
          modifications:
            type: string
            description: >-
              Comma-separated MODOMICS short name(s) for modifications
              reported in this dataset, akin to *modification_names* from
              euf-specs header
          project_id:
            type: string
            description: Project identifier (SMID) this dataset is related to
          rna:
            type: string
            description: RNA type (not an euf-specs header field)
          sequencing_platform:
            type: string
            nullable: true
            description: Sequencing platform (euf-specs)
          taxa_id:
            type: integer
            description: NCBI taxon (*organism* from euf-specs header)
          taxa_sname:
            type: string
            description: NCBI name for `taxa_id`
          tech:
            type: string
            description: Detection technology used in this dataset
    Permission:
      type: object
      required: _ write_access
      properties:
        write_access:
          type: boolean
          description: >-
            True if the current user is allowed to modify this dataset
