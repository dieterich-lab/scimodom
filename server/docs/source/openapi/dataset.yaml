info:
  title: datasets
  description: >-
    Dataset access and upload

tags:
  - name: Dataset
    description: Dataset metadata, import and export
  - name: Permission
    description: Dataset permissions

paths:
  /datasets:
    get:
      tags:
        - Dataset
      summary: Get dataset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
    post:
      tags:
        - Dataset
      summary: Add dataset and import data
      description: >-
        Import a previously uploaded bedRMod file (see
        `POST /uploads`) into an existing project. The caller
        must be associated with the target project's SMID.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDatasetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetCreated"
        "400":
          description: >-
            Malformed request body or template validation failed
        "401":
          $ref: "_common.yaml#/components/responses/UnauthorizedError"
        "403":
          $ref: "_common.yaml#/components/responses/ForbiddenError"
        "404":
          description: Parameter not found
        "409":
          description: A dataset with the same content already exists
        "422":
          description: >-
            The upload was rejected during import (euf-specs).
            Also returned for a malformed or expired JWT
        "500":
          description: Liftover failed, or an unexpected server error occurred
        "501":
          description: RNA type annotation not implemented
  /users/me/datasets:
    get:
      tags:
        - Dataset
      summary: Get dataset per user
      description: >-
        Dataset submitted by the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "_common.yaml#/components/responses/UnauthorizedError"
        "422":
          $ref: "_common.yaml#/components/responses/UnauthorizedErrorContent"
  /datasets/summary:
    get:
      tags:
        - Dataset
      summary: Get dataset count
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
  /datasets/{dataset_id}/bedrmod:
    get:
      tags:
        - Dataset
      summary: Export dataset as bedRMod
      parameters:
        - in: path
          name: dataset_id
          required: true
          schema:
            type: string
          description: Dataset identifier (EUFID)
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema:
                type: string
                description: Consult the euf-specs for more information
        "404":
          description: Dataset not found
  /users/me/datasets/{dataset_id}/permissions:
    get:
      tags:
        - Permission
      summary: Get user dataset permissions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: dataset_id
          required: true
          schema:
            type: string
          description: Dataset identifier (EUFID)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "_common.yaml#/components/responses/UnauthorizedError"
        "422":
          $ref: "_common.yaml#/components/responses/UnauthorizedErrorContent"
        "404":
          description: Dataset not found

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  links:
    GetFileById:
      description: >-
        The `file_id` returned in the response can be used
        as `upload` query parameter in `GET /datasets/comparisons/intersect`,
        `/closest`, or `/subtract`, or as `file_id` in the request body
        of `POST /datasets`.
      operationId: getIntersectQueryParam
      parameters:
        upload: "$response.body#/file_id"
  schemas:
    AddDatasetBody:
      type: object
      required:
        - smid
        - file_id
        - rna_type
        - title
        - assembly_id
        - modification_id
        - organism_id
        - technology_id
      properties:
        smid:
          type: string
          description: Project SMID the dataset will be added to
        file_id:
          type: string
          description: >-
            Identifier returned by `POST /uploads` for the
            bedRMod file to import
        rna_type:
          type: string
          description: >-
            One of the RNA type IDs returned by `GET /catalogs/rna-types`
        title:
          type: string
          maxLength: 255
        assembly_id:
          type: integer
          description: Assembly identifier
        modification_id:
          description: One or more modification identifiers
          type: array
          minItems: 1
          items:
            type: integer
        organism_id:
          type: integer
          description: Organism identifier
        technology_id:
          type: integer
          description: Technology identifier
    DatasetCreated:
      type: object
      properties:
        dataset_id:
          type: string
          description: Newly created dataset identifier (EUFID)
    Count:
      type: object
      properties:
        count:
          type: integer
          description: Number of dataset
    Dataset:
      type: array
      items:
        type: object
        properties:
          basecalling:
            type: string
            nullable: true
            description: Basecalling model information (euf-specs)
          bioinformatics_workflow:
            type: string
            nullable: true
            description: >-
              Link to bioinformatics workflow; program name, version, and/or call; information
              relevant to score calculation; etc. (euf-specs)
          cto:
            type: string
            description: Cell, tissue, or organism
          dataset_id:
            type: string
            description: Dataset identifier (EUFID)
          dataset_title:
            type: string
            description: Dataset title
          doi:
            type: string
            nullable: true
            description: A comma-separated list of DOIs associated with this project
          experiment:
            type: string
            nullable: true
            description: >-
              Information about or link to experimental protocol
              and design (euf-specs)
          modomics_sname:
            type: string
            description: >-
              Comma-separated MODOMICS short name(s) for modifications
              reported in this dataset
          pmid:
            type: string
            nullable: true
            description: A comma-separated list of PMIDs associated with this project
          project_id:
            type: string
            description: Project identifier (SMID)
          project_summary:
            type: string
            description: Project summary to which this dataset belong
          project_title:
            type: string
            description: Project title to which this dataset belong
          rna:
            type: string
            description: RNA type (`modification_type` euf-specs)
          sequencing_platform:
            type: string
            nullable: true
            description: Sequencing platform (euf-specs)
          taxa_id:
            type: integer
            description: NCBI taxon (`organism` euf-specs)
          taxa_sname:
            type: string
            description: NCBI name for `taxa_id`
          tech:
            type: string
            description: Detection technology used in this dataset
    Permission:
      type: object
      properties:
        write_access:
          type: boolean
          description: >-
            True if the current user is allowed to modify this dataset
