# The Sphinx build step copies these values into newly generated specs
# from fragments. The info.version below is a FALLBACK only.
# Keep it in sync by hand only as a last resort for a standalone lint
# run without the package installed.

openapi: 3.0.4

info:
  version: v0
  license:
    name: GNU AGPLv3+
    url: https://github.com/dieterich-lab/scimodom/blob/master/LICENSE

servers:
  - url: "http://127.0.0.1:5000/api/{version}" #"https://scimodom.dieterichlab.org/api/{version}"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        user_message:
          type: string
          description: >-
            Optional. Error caused by user input with
            additional context.
      required:
        - message
  responses:
    UnauthorizedError:
      description: Missing Authorization Header
    ForbiddenError:
      description: Access or write permission denied
    TooLargeError:
      description: File exceeds max. allowed size
    UnauthorizedErrorContent:
      description: >-
        JWT signature verification failed, invalid or expired token
    InternalServerError:
      description: Internal Server Error
