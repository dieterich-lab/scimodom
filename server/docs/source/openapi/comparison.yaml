info:
  title: comparisons
  description: >-
    Dataset comparisons

tags:
  - name: Compare
    description: Complex queries and data comparisons

paths:
  /datasets/comparisons/intersect:
    get:
      tags:
        - Compare
      summary: Search for overlapping sites
      description: >-
        Intersection between `reference` and `comparison` or `upload`. The response
        returns the reference set of records as `a`; and the records matching the query as `b`
      parameters:
        - $ref: "#/components/parameters/referenceQueryParam"
        - $ref: "#/components/parameters/comparisonQueryparam"
        - $ref: "#/components/parameters/strandQueryParam"
        - $ref: "#/components/parameters/uploadQueryParam"
        - $ref: "#/components/parameters/uploadNameQueryParam"
        - $ref: "#/components/parameters/eufQueryParam"
        - $ref: "#/components/parameters/taxaQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intersect"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "422":
          $ref: "#/components/responses/ClientResponseException422"
        "500":
          $ref: "#/components/responses/LiftoverFailed"
  /datasets/comparisons/closest:
    get:
      tags:
        - Compare
      summary: Search for closest non-overlapping sites
      description: >-
        Closest non-overlaps in `comparison` or `upload` with respect to `reference`.
        The response returns the reference set of records as `a`; and the records
        matching the query as `b`
      parameters:
        - $ref: "#/components/parameters/referenceQueryParam"
        - $ref: "#/components/parameters/comparisonQueryparam"
        - $ref: "#/components/parameters/strandQueryParam"
        - $ref: "#/components/parameters/uploadQueryParam"
        - $ref: "#/components/parameters/uploadNameQueryParam"
        - $ref: "#/components/parameters/eufQueryParam"
        - $ref: "#/components/parameters/taxaQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Closest"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "422":
          $ref: "#/components/responses/ClientResponseException422"
        "500":
          $ref: "#/components/responses/LiftoverFailed"
  /datasets/comparisons/subtract:
    get:
      tags:
        - Compare
      summary: Search for strict non-overlaps
      description: >-
        Strict non-overlaps in `reference` with respect to `comparison` or `upload`.
        The response returns the reference set of records matching the query
      parameters:
        - $ref: "#/components/parameters/referenceQueryParam"
        - $ref: "#/components/parameters/comparisonQueryparam"
        - $ref: "#/components/parameters/strandQueryParam"
        - $ref: "#/components/parameters/uploadQueryParam"
        - $ref: "#/components/parameters/uploadNameQueryParam"
        - $ref: "#/components/parameters/eufQueryParam"
        - $ref: "#/components/parameters/taxaQueryParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subtract"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          $ref: "#/components/responses/ClientResponseException404"
        "422":
          $ref: "#/components/responses/ClientResponseException422"
        "500":
          $ref: "#/components/responses/LiftoverFailed"

components:
  parameters:
    referenceQueryParam:
      in: query
      name: reference
      required: true
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: Up to 3 reference dataset identifiers (EUFID)
    comparisonQueryparam:
      in: query
      name: comparison
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: >-
        Up to 3 dataset identifiers (EUFID) for comparison. Required if `upload` is
        not used; mutually exclusive with `upload`
    strandQueryParam:
      in: query
      name: strandAware
      required: false
      schema:
        type: boolean
        default: true
      description: If true, perform operations on the same strand
    uploadQueryParam:
      in: query
      name: upload
      required: false
      schema:
        type: string
      description: >-
        `file_id` of a temporary uploaded BED or bedRMod file to compare,
        as returned by `POST /uploads`. Required if `comparison` is not
        used; mutually exclusive with `comparison`
    uploadNameQueryParam:
      in: query
      name: uploadName
      required: false
      schema:
        type: string
        default: upload
      description: >-
        File name or description. Only used with `upload`
    eufQueryParam:
      in: query
      name: euf
      required: false
      schema:
        type: boolean
        default: false
      description: >-
        If true, the uploaded file must follow the latest bedRMod
        specifications, else it is treated as a BED6 file (`score`
        and `coverage` default to 1). Only used if `upload` is used
    taxaQueryParam:
      in: query
      name: taxaId
      required: false
      schema:
        type: integer
      description: >-
        NCBI taxon used to validate the uploaded file
        header against the reference assembly. Required if `euf` is
        true (and thus only relevant if `upload` is used)
  responses:
    ClientResponseException400:
      description: Invalid request format or validation error
    ClientResponseException404:
      description: >-
        Dataset, uploaded file, or taxon not found
    ClientResponseException422:
      description: >-
        Uploaded file validation failed (euf-specs)
    LiftoverFailed:
      description: Uploaded file liftover failed
  schemas:
    Comparison:
      type: object
      required:
        - chrom
        - start
        - end
        - name
        - score
        - strand
        - coverage
        - frequency
        - eufid
      properties:
        chrom:
          type: string
          description: Chromosome name
        start:
          type: integer
          description: Feature start position
        end:
          type: integer
          description: Feature end position
        name:
          type: string
          description: >-
            Feature name (MODOMICS short name if `comparison` is used,
            or the uploaded file's own name column if `upload` is used).
        score:
          type: integer
          description: >-
            Feature score (valid coverage if `comparison` is used, or the
            uploaded file's own score column if `upload` is used).
        strand:
          type: string
          enum:
            - "+"
            - "-"
            - "."
          description: Feature strand
        coverage:
          type: integer
          description: >-
            Feature coverage, or 1 if `upload` is used and `euf` is false
        frequency:
          type: number
          description: >-
            Feature frequency (percentage of modification), or 1 if
            `upload` is used and `euf` is false
        eufid:
          type: string
          description: >-
            EUFID (dataset identifier), or `UPLOAD`/`LIFTED` (padded to
            the EUFID length) if `upload` is used
    Intersect:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              a:
                $ref: "#/components/schemas/Comparison"
              b:
                $ref: "#/components/schemas/Comparison"
            required:
              - a
              - b
    Closest:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              a:
                $ref: "#/components/schemas/Comparison"
              b:
                $ref: "#/components/schemas/Comparison"
              distance:
                type: integer
                description: Distance to closest feature
            required:
              - a
              - b
              - distance
    Subtract:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/Comparison"
