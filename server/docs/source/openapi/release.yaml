info:
  title: info
  description: >-
    Build, API, and database version information.

tags:
  - name: Version
    description: Build version

paths:
  /info:
    get:
      tags:
        - Version
      summary: Get version information
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

components:
  schemas:
    Version:
      type: object
      properties:
        build:
          type: object
          properties:
            tag:
              type: string
              nullable: true
              description: Git tag or null outside a packaged build
            commit:
              type: string
              nullable: true
              description: Git commit or null outside a packaged build
            commit_date:
              type: string
              nullable: true
              description: Commit timestamp or null outside a packaged build
            version:
              type: string
              description: Source version
            generated_at:
              type: string
              description: Build timestamp
        api:
          type: object
          properties:
            version:
              type: string
              description: REST API version
        database:
          type: object
          properties:
            current_revision:
              type: string
              description: Alembic revision (build)
            expected_revision:
              type: string
              description: Alembic revision (source)
