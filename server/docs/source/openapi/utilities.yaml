info:
  title: Utilities REST API

tags:
  - name: assembly
    description: Database tables for species and assemblies
  - name: modification
    description: Database tables for modifications
  - name: internal
    description: Database summary statistics

paths:
  /rna_types:
    get:
      tags:
        - modification
      summary: Get RNA types
      description: Retrieve available RNA types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: RNA type identifier
                    label:
                      type: string
                      description: RNA type description
        "500":
          $ref: "#/components/responses/InternalServerError"
  /taxa:
    get:
      tags:
        - assembly
      summary: Get species
      description: Retrieve available species with their taxonomic information
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    domain:
                      type: string
                      description: Domain
                    kingdom:
                      type: string
                      description: Kingdom
                    phylum:
                      type: string
                      description: Phylum
                    taxa_id:
                      type: integer
                      description: NCBI taxon
                    taxa_name:
                      type: string
                      description: NCBI name for `taxa_id`
                    taxa_sname:
                      type: string
                      description: Abbreviation for `taxa_name`
        "500":
          $ref: "#/components/responses/InternalServerError"
  /modomics:
    get:
      tags:
        - modification
      summary: Get modifications
      description: Retrieve available modifications
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: MODOMICS code
                    modomics_sname:
                      type: string
                      description: MODOMICS short name
        "500":
          $ref: "#/components/responses/InternalServerError"
  /methods:
    get:
      tags:
        - modification
      summary: Get detection methods
      description: Retrieve available detection methods and their classification
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Detection method identifier
                    cls:
                      type: string
                      description: Classification
                    meth:
                      type: string
                      description: Detection method
        "500":
          $ref: "#/components/responses/InternalServerError"
  /selections:
    get:
      tags:
        - modification
      summary: Get selections
      description: Retrieve available combinations of modification, organism, and technology
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cls:
                      type: string
                      description: Detection method classification
                    cto:
                      type: string
                      description: Cell, type, or organism
                    domain:
                      type: string
                      description: Taxonomic domain
                    kingdom:
                      type: string
                      description: Taxonomic kingdom
                    meth:
                      type: string
                      description: Detection method
                    modification_id:
                      type: integer
                      description: Modification identifier (MODOMICS code, `rna`)
                    modomics_sname:
                      type: string
                      description: MODOMICS short name
                    organism_id:
                      type: integer
                      description: Organism identifier (`taxa_id`, `cto`)
                    rna:
                      type: string
                      description: RNA type
                    rna_name:
                      type: string
                      description: RNA type description
                    selection_id:
                      type: integer
                      description: Selection identifier
                    taxa_id:
                      type: integer
                      description: NCBI taxon
                    taxa_name:
                      type: string
                      description: NCBI name for `taxa_id`
                    taxa_sname:
                      type: string
                      description: Abbreviation for `taxa_name`
                    tech:
                      type: string
                      description: Detection technology
                    technology_id:
                      type: integer
                      description: Detection technology identifier (method identifier, `tech`)
        "500":
          $ref: "#/components/responses/InternalServerError"
  /genes:
    get:
      tags:
        - modification
      summary: Get genomic annotation
      description: >-
        Retrieve all genes associated with a given selection (modification, organism, technology).
      parameters:
        - in: query
          name: selection
          required: true
          schema:
            type: string
          description: A selection identifier
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Gene symbol
        "404":
          description: >-
            Unrecognized selection identifier (not found or no data for this selection)
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /chroms/{taxa_id}:
    get:
      tags:
        - assembly
      summary: Get chromosomes and their size
      description: >-
        Retrieve chromosomes and their size for the current assembly associated with a given taxon
      parameters:
        - in: path
          name: taxa_id
          required: true
          schema:
            type: integer
          description: A valid NCBI taxon
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    chrom:
                      type: string
                      description: Chromosome name
                    size:
                      type: integer
                      description: Chromosome size
        "400":
          description: Invalid Taxa ID
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "404":
          description: >-
            Unrecognized Taxa ID (unknown or unavailable taxon)
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /assembly/{taxa_id}:
    get:
      tags:
        - assembly
      summary: Get assemblies
      description: Retrieve available assemblies for the given taxon
      parameters:
        - in: path
          name: taxa_id
          required: true
          schema:
            type: integer
          description: A valid NCBI taxon
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Assembly identifier
                    name:
                      type: string
                      description: Assembly name
        "400":
          description: Invalid Taxa ID
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "404":
          description: >-
            Unrecognized Taxa ID (unknown or unavailable taxon)
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /release:
    get:
      tags:
        - internal
      summary: Get release information
      description: Retrieve number of sites and datasets for current release
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: integer
                    description: Number of sites
                  datasets:
                    type: integer
                    description: Number of dataset
        "500":
          $ref: "#/components/responses/InternalServerError"
  /sunburst/{chart}:
    get:
      tags:
        - internal
      # not a general-purpose API endpoint
      x-internal: true
      summary: Get sunburst chart data
      description: >-
        Retrieve a JSON object to generate one of the sunburst charts.
        Primarily intended for use by the frontend rather than for general API consumption.
      parameters:
        - in: path
          name: chart
          required: true
          schema:
            type: string
            enum: [search, browse]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Sunburst chart data
        "404":
          description: Unrecognized chart type
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
