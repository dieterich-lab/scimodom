info:
  title: projects
  description: >-
    Project access

tags:
  - name: Browse
    description: Projects metadata

paths:
  /projects:
    get:
      tags:
        - Browse
      summary: Get projects
      description: >-
        Sci-ModoM's Browse interface
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{project_id}/selections:
    get:
      tags:
        - Browse
      summary: Get selections per project
      description: >-
        Combinations of modification, organism, and technology for which
        datasets can be added to the project. The response is the same as
        `GET /catalogs/selections`, except that `selection_id` is null if
        no dataset with this selection has been uploaded yet.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project identifier (SMID)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSelection"
        "400":
          description: Invalid project identifier
        "404":
          description: Project identifier not found
  /users/me/projects:
    get:
      tags:
        - Browse
      summary: Get projects per user
      description: >-
        Projects added after a request submission; these projects
        remain associated with the current user, who gains permission to
        upload datasets and modify attachments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  responses:
    UnauthorizedError:
      $ref: "_common.yaml#/components/responses/UnauthorizedError"
    ForbiddenError:
      $ref: "_common.yaml#/components/responses/ForbiddenError"
    UnprocessableContentError:
      $ref: "_common.yaml#/components/responses/UnprocessableContentError"
  schemas:
    Project:
      type: array
      items:
        type: object
        required:
          - contact_institution
          - contact_name
          - date_added
          - date_published
          - doi
          - pmid
          - project_id
          - project_summary
          - project_title
        properties:
          contact_institution:
            type: string
            description: >-
              The institution or affiliation of `contact_name`
          contact_name:
            type: string
            description: >-
              The author of the data or a contact person responsible for adding the data
          date_added:
            type: number
            description: >-
              POSIX timestamp corresponding to the date the project was added. In
              Sci-ModoM (UI), this is converted to YYYY-MM-DD (ISO 8601)
          date_published:
            type: number
            nullable: true
            description: >-
              POSIX timestamp corresponding to the date of publication. In
              Sci-ModoM (UI), this is converted to YYYY-MM-DD (ISO 8601).
          doi:
            type: string
            nullable: true
            description: A list of DOIs associated with this project
          pmid:
            type: string
            nullable: true
            description: A list of PMIDs associated with this project
          project_id:
            type: string
            description: Project identifier (SMID)
          project_summary:
            type: string
          project_title:
            type: string
    ProjectSelection:
      type: array
      items:
        type: object
        required:
          - cls
          - cto
          - domain
          - kingdom
          - meth
          - modification_id
          - modomics_short_name
          - organism_id
          - rna_type
          - rna_type_name
          - selection_id
          - taxa_id
          - taxa_name
          - taxa_short_name
          - tech
          - technology_id
        properties:
          cls:
            type: string
            description: Detection method classification
          cto:
            type: string
            description: Cell, tissue, or organism
          domain:
            type: string
            description: Taxonomic domain
          kingdom:
            type: string
            nullable: true
            description: Taxonomic kingdom
          meth:
            type: string
            description: Detection method
          modification_id:
            type: integer
            description: Modification identifier (MODOMICS code, `rna_type`)
          modomics_short_name:
            type: string
            description: MODOMICS short name
          organism_id:
            type: integer
            description: Organism identifier (`taxa_id`, `cto`)
          rna_type:
            type: string
            description: RNA type identifier (see `GET /catalogs/rna-types`)
          rna_type_name:
            type: string
            description: RNA type name (description)
          selection_id:
            type: integer
            nullable: true
            description: >-
              Selection identifier; null if there is no dataset yet
              with this combination (the selection does not exist)
          taxa_id:
            type: integer
            description: NCBI taxon
          taxa_name:
            type: string
            description: NCBI name for `taxa_id`
          taxa_short_name:
            type: string
            description: Abbreviation for `taxa_name`
          tech:
            type: string
            description: Detection technology
          technology_id:
            type: integer
            description: Detection technology identifier (`meth`, `tech`)
