info:
  title: User REST API

tags:
  - name: login
    description: User registration and login
  - name: password
    description: Manage access

paths:
  /users:
    post:
      tags:
        - login
      summary: Register a new user
      description: >-
        Creates a new, inactive user and e-mails a confirmation link.
      requestBody:
        $ref: "#/components/requestBodies/LoginBody"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad request (malformed request body, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            Internal server error (may be a failed registration e-mail).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/confirmation:
    post:
      tags:
        - login
      summary: Confirm registration
      description: Activate a registered user using the confirmation link.
      requestBody:
        $ref: "#/components/requestBodies/ConfirmBody"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad request (malformed request body, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong username, wrong or expired confirmation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/password/request:
    post:
      tags:
        - password
      summary: Request a password reset
      description: >-
        Reset confirmation token and e-mails the password reset link.
      requestBody:
        $ref: "#/components/requestBodies/UserBody"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad request (malformed request body, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown user or wrong email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/password/reset:
    post:
      tags:
        - password
      summary: Reset a password
      description: >-
        Set a new password using the token e-mailed by
        `POST /users/password/request`.
      requestBody:
        $ref: "#/components/requestBodies/AuthBody"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad request (malformed request body, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Wrong username, wrong, used, or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /sessions:
    post:
      tags:
        - login
      summary: Login
      description: Login
      requestBody:
        $ref: "#/components/requestBodies/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT
        "400":
          description: Bad request (malformed request body, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong user or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /sessions/refresh:
    post:
      tags:
        - login
      summary: Refresh the access token
      description: >-
        Exchange a valid access token for a new one with a fresh expiry.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT
        "401":
          description: >-
            Unauthorized (expired token, missing header)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Unprocessable Content (not enough segments, signature verification failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/me/password:
    put:
      tags:
        - password
      summary: Change the current user's password
      security:
        - BearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/PasswordBody"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad request (malformed request body, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Unauthorized (expired token, missing header)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Unprocessable Content (not enough segments, signature verification failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/me:
    get:
      summary: Get username
      description: Retrieve the e-mail address of the authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    description: username (e-mail address)
        "401":
          description: >-
            Unauthorized (expired token, missing header)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Unprocessable Content (not enough segments, signature verification failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  schemas:
    Error:
      $ref: "_common.yaml#/components/schemas/Error"
  responses:
    UnauthorizedError:
      $ref: "_common.yaml#/components/responses/UnauthorizedError"
    InternalServerError:
      $ref: "_common.yaml#/components/responses/InternalServerError"
  requestBodies:
    UserBody:
      description: JSON object with username
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                description: Username (e-mail address)
    LoginBody:
      description: JSON object with username and password
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                description: Username (e-mail address)
              password:
                type: string
                description: Password
    AuthBody:
      description: JSON object with username, token, and new password
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, token, password]
            properties:
              email:
                type: string
                description: Username (e-mail address)
              password:
                type: string
                description: New password
              token:
                type: string
                description: Confirmation token (e-mailed)
    ConfirmBody:
      description: JSON object with username and token
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, token]
            properties:
              email:
                type: string
                description: Username (e-mail address)
              token:
                type: string
                description: Confirmation token (e-mailed)
    PasswordBody:
      description: JSON object with new password
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password:
                type: string
                description: New password
