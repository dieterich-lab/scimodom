info:
  title: users
  description: >-
    Users and sessions

tags:
  - name: User
    description: User registration and management
  - name: Session
    description: Login and access

paths:
  /users:
    post:
      tags:
        - User
      summary: Register a new user
      description: >-
        Creates a new, inactive user and e-mails a confirmation link
      requestBody:
        $ref: "#/components/requestBodies/LoginBody"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "409":
          description: User already exists
        "500":
          description: SMTP error
  /users/confirmation:
    post:
      tags:
        - User
      summary: Confirm registration
      description: >-
        Activate a registered user using the confirmation link.
      requestBody:
        $ref: "#/components/requestBodies/ConfirmBody"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "401":
          description: Invalid credentials or expired confirmation token
  /users/password/request:
    post:
      tags:
        - User
      summary: Request a password reset
      description: >-
        Reset confirmation token and e-mails the password reset link
      requestBody:
        $ref: "#/components/requestBodies/UserBody"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "404":
          description: User not found
        "500":
          description: SMTP error
  /users/password/reset:
    post:
      tags:
        - User
      summary: Reset a password
      description: >-
        Set a new password using the token e-mailed by
        `POST /users/password/request`.
      requestBody:
        $ref: "#/components/requestBodies/AuthBody"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "401":
          description: Invalid credentials or expired confirmation token
  /users/me:
    get:
      tags:
        - User
      summary: Get username
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Username"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
  /users/me/password:
    put:
      tags:
        - User
      summary: Change the current user's password
      security:
        - BearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/PasswordBody"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
  /sessions:
    post:
      tags:
        - Session
      summary: Login
      description: Login
      requestBody:
        $ref: "#/components/requestBodies/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          $ref: "#/components/responses/ClientResponseException400"
        "401":
          description: Invalid credentials
  /sessions/refresh:
    post:
      tags:
        - Session
      summary: Refresh the access token
      description: >-
        Exchange a valid access token for a new one with a fresh expiry
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"

components:
  securitySchemes:
    BearerAuth:
      $ref: "_common.yaml#/components/securitySchemes/BearerAuth"
  responses:
    ClientResponseException400:
      description: Payload validation failed
    UnauthorizedError:
      $ref: "_common.yaml#/components/responses/UnauthorizedError"
    UnprocessableContentError:
      $ref: "_common.yaml#/components/responses/UnprocessableContentError"
  schemas:
    Username:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: username (e-mail address)
    Token:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: JWT
  requestBodies:
    UserBody:
      description: JSON object with username
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                description: Username (e-mail address)
    LoginBody:
      description: JSON object with username and password
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                description: Username (e-mail address)
              password:
                type: string
                description: Password
    AuthBody:
      description: JSON object with username, token, and new password
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, token, password]
            properties:
              email:
                type: string
                description: Username (e-mail address)
              password:
                type: string
                description: New password
              token:
                type: string
                description: Confirmation token (e-mailed)
    ConfirmBody:
      description: JSON object with username and token
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, token]
            properties:
              email:
                type: string
                description: Username (e-mail address)
              token:
                type: string
                description: Confirmation token (e-mailed)
    PasswordBody:
      description: JSON object with new password
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password:
                type: string
                description: New password
