---
info:
  title: catalogs
  description: >-
    Reference, catalogs, shared lookup, and definition tables

tags:
  - name: Nomenclature
    description: >-
      Reference (seed) data, definitions, and controlled vocabularies
  - name: Reference resources
    description: >-
      Configured genome assemblies and annotations
  - name: Content
    description: >-
      Content selection that depends on data records

paths:
  /catalogs/rna-types:
    get:
      tags:
        - Nomenclature
      summary: Get RNA types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RNAType"
  /catalogs/rna-types/{rna_type}/biotypes:
    get:
      tags:
        - Nomenclature
      summary: Get biotypes
      description: >-
        The biotypes are currently independent of `rna_type`;
        the path parameter is accepted but not used to filter the result
      parameters:
        - in: path
          name: rna_type
          required: true
          schema:
            type: string
          description: RNA type identifier
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Biotype"
  /catalogs/rna-types/{rna_type}/features:
    get:
      tags:
        - Nomenclature
      summary: Get genomic features
      parameters:
        - in: path
          name: rna_type
          required: true
          schema:
            type: string
          description: RNA type identifier
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "400":
          description: Invalid RNA type
        "404":
          description: RNA type not found
        "501":
          description: RNA type annotation not implemented
  /catalogs/taxa:
    get:
      tags:
        - Nomenclature
      summary: Get species with taxonomic information
      description: >-
        Every taxon known to this instance. A taxon may have no data,
        cf. `GET /catalogs/selections`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxon"
  /catalogs/chromosomes:
    get:
      tags:
        - Reference resources
      summary: Get chromosomes and their size
      description: >-
        The chromosomes of the current assembly per taxon
      parameters:
        - in: query
          name: taxaId
          required: true
          schema:
            type: integer
          description: NCBI taxon
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chromosome"
        "400":
          description: Missing or invalid NCBI taxon
        "404":
          description: NCBI taxon or chromosome data not found
  /catalogs/assemblies:
    get:
      tags:
        - Reference resources
      summary: Get assemblies
      description: >-
        Every assembly configured; `current` distinguishes the
        assembly that is installed (per taxon), `source` records
        the installed snapshot
      parameters:
        - in: query
          name: taxaId
          required: false
          schema:
            type: integer
          description: NCBI taxon to restrict the result to
        - in: query
          name: current
          required: false
          schema:
            type: boolean
          description: >-
            `true` for the current assemblies only, `false` for the
            others only. Omit for all of them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assembly"
        "400":
          description: Invalid NCBI taxon, or invalid value for `current`
        "404":
          description: NCBI taxon not found
  /catalogs/annotations:
    get:
      tags:
        - Reference resources
      summary: Get current annotations
      description: >-
        Only the annotations in use are returned
      parameters:
        - in: query
          name: taxaId
          required: false
          schema:
            type: integer
          description: NCBI taxon to restrict the result to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          description: Invalid NCBI taxon
        "404":
          description: NCBI taxon not found
  /catalogs/modomics:
    get:
      tags:
        - Nomenclature
      summary: Get modifications nomenclature
      description: Reference modifications annotated by MODOMICS
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Modomics"
  /catalogs/methods:
    get:
      tags:
        - Nomenclature
      summary: Get detection methods and classification
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method"
  /catalogs/selections:
    get:
      tags:
        - Content
      summary: Get selections
      description: >-
        Only the combinations of modification, organism and
        technology for which data exists are returned: a selection
        is created when a dataset is uploaded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Selection"
  /catalogs/genes:
    get:
      tags:
        - Content
      summary: Get genes
      description: >-
        Only the genes annotated in the given selections are
        returned, not every gene of an annotation
      parameters:
        - in: query
          name: selection
          required: true
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: One or more selection identifier(s)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gene"
        "400":
          description: Invalid or missing selection(s)
        "404":
          description: Selection identifier(s) not found

components:
  schemas:
    RNAType:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: string
            description: RNA type identifier
          name:
            type: string
            description: RNA type name (description)
    Biotype:
      type: object
      required:
        - biotypes
      properties:
        biotypes:
          type: array
          items:
            type: string
            description: Biotypes display categories
    Feature:
      type: object
      required:
        - features
      properties:
        features:
          type: array
          items:
            type: string
            description: Genomic features
    Taxon:
      type: array
      items:
        type: object
        required:
          - domain
          - kingdom
          - phylum
          - taxa_id
          - taxa_name
          - taxa_short_name
        properties:
          domain:
            type: string
          kingdom:
            type: string
            nullable: true
          phylum:
            type: string
            nullable: true
          taxa_id:
            type: integer
            description: NCBI taxon
          taxa_name:
            type: string
            description: NCBI name for `taxa_id`
          taxa_short_name:
            type: string
            description: Abbreviation for `taxa_name`
    Chromosome:
      type: array
      items:
        type: object
        required:
          - chrom
          - size
        properties:
          chrom:
            type: string
            description: Chromosome name
          size:
            type: integer
            description: Chromosome size
    Assembly:
      type: array
      items:
        type: object
        required:
          - id
          - name
          - alt_name
          - taxa_id
          - taxa_name
          - current
          - source
        properties:
          id:
            type: integer
          name:
            type: string
            description: Assembly name
          alt_name:
            type: string
            nullable: true
            description: Alternative assembly name
          taxa_id:
            type: integer
            description: NCBI taxon
          taxa_name:
            type: string
            description: NCBI name for `taxa_id`
          current:
            type: boolean
            description: >-
              True if the current assembly; any other assembly is
              kept only to lift over to the current
          source:
            $ref: "#/components/schemas/InstalledSource"
    InstalledSource:
      type: object
      # nullable on the schema, not on the property: a sibling of
      # `$ref` is ignored in OpenAPI 3.0, and `allOf` loses it
      nullable: true
      description: >-
        Installation source per taxon; null indicates that
        the source is not recorded and may suggest an installation issue
      required:
        - provider
        - release
        - archive
      properties:
        provider:
          type: string
          description: Reference data provider e.g. `ensembl`
        release:
          type: integer
          description: Release of `provider` the files were obtained from
        archive:
          type: string
          nullable: true
          description: >-
            Where `provider` serves `release`. Null if the provider
            keeps no per-release archive
    Annotation:
      type: array
      items:
        type: object
        required:
          - id
          - source
          - release
          - archive
          - browse_url
          - assembly_id
          - assembly_name
          - taxa_id
          - taxa_name
        properties:
          id:
            type: integer
          source:
            type: string
            description: Annotation source e.g. `ensembl`
          release:
            type: integer
            description: Release of `source` the annotation comes from
          archive:
            type: string
            nullable: true
            description: >-
              Where `source` serves `release`. Null if the source
              keeps no per-release archive
          browse_url:
            type: string
            nullable: true
            description: >-
              Page of `source` for this organism at `release`, which
              the path of a record page is appended to. Null if the
              source serves no browsable page for a release
          assembly_id:
            type: integer
            description: Associated assembly
          assembly_name:
            type: string
          taxa_id:
            type: integer
            description: NCBI taxon
          taxa_name:
            type: string
            description: NCBI name for `taxa_id`
    Modomics:
      type: array
      items:
        type: object
        required:
          - id
          - modomics_short_name
        properties:
          id:
            type: string
            description: MODOMICS code
          modomics_short_name:
            type: string
            description: MODOMICS short name
    Method:
      type: array
      items:
        type: object
        required:
          - id
          - cls
          - meth
        properties:
          id:
            type: string
            description: Detection method identifier
          cls:
            type: string
            description: Classification
          meth:
            type: string
            description: Detection method name
    Selection:
      type: array
      items:
        type: object
        required:
          - cls
          - cto
          - domain
          - kingdom
          - meth
          - modification_id
          - modomics_short_name
          - organism_id
          - rna_type
          - rna_type_name
          - selection_id
          - taxa_id
          - taxa_name
          - taxa_short_name
          - tech
          - technology_id
        properties:
          cls:
            type: string
            description: Detection method classification
          cto:
            type: string
            description: Cell, tissue, or organism
          domain:
            type: string
            description: Taxonomic domain
          kingdom:
            type: string
            nullable: true
            description: Taxonomic kingdom
          meth:
            type: string
            description: Detection method
          modification_id:
            type: integer
            description: Modification identifier (MODOMICS code, `rna_type`)
          modomics_short_name:
            type: string
            description: MODOMICS short name
          organism_id:
            type: integer
            description: Organism identifier (`taxa_id`, `cto`)
          rna_type:
            type: string
            description: RNA type identifier (see `GET /catalogs/rna-types`)
          rna_type_name:
            type: string
            description: RNA type name (description)
          selection_id:
            type: integer
            description: Selection identifier
          taxa_id:
            type: integer
            description: NCBI taxon
          taxa_name:
            type: string
            description: NCBI name for `taxa_id`
          taxa_short_name:
            type: string
            description: Abbreviation for `taxa_name`
          tech:
            type: string
            description: Detection technology
          technology_id:
            type: integer
            description: Detection technology identifier (`meth`, `tech`)
    Gene:
      type: array
      items:
        type: string
        description: Gene symbol
