info:
  title: catalogs REST API
  description: >-
    Reference, catalogs, shared lookup, and definition tables.

tags:
  - name: assembly
    description: Database tables for taxon and assemblies
  - name: RNA
    description: Database tables for RNA types and annotations
  - name: modification
    description: Database tables for modifications reference information
  - name: content
    description: Database tables for content selection

paths:
  /catalogs/rna-types:
    get:
      tags:
        - RNA
      summary: Get RNA types
      description: Retrieve available RNA types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: RNA type identifier
                    label:
                      type: string
                      description: RNA type description
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/rna-types/{rna_type}/biotypes:
    get:
      tags:
        - RNA
      summary: Get biotypes
      description: >-
        Retrieve available biotypes. The biotypes are currently
        independent of `rna_type`; the path parameter is accepted but
        not used to filter the result.
      parameters:
        - in: path
          name: rna_type
          required: true
          schema:
            type: string
          description: A valid RNA type identifier
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  biotypes:
                    type: array
                    items:
                      type: string
                      description: Biotypes display categories
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/rna-types/{rna_type}/features:
    get:
      tags:
        - RNA
      summary: Get features
      description: Retrieve available genomic features for a given RNA type
      parameters:
        - in: path
          name: rna_type
          required: true
          schema:
            type: string
          description: A valid RNA type identifier
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items:
                      type: string
                      description: Genomic features
        "400":
          description: Bad Request - invalid RNA type
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "404":
          description: Not found - RNA type
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: Not Implemented - RNA type annotation
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
  /catalogs/taxa:
    get:
      tags:
        - assembly
      summary: Get taxa
      description: Retrieve available species with their taxonomic information
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    domain:
                      type: string
                      description: Domain
                    kingdom:
                      type: string
                      description: Kingdom
                    phylum:
                      type: string
                      description: Phylum
                    taxa_id:
                      type: integer
                      description: NCBI taxon
                    taxa_name:
                      type: string
                      description: NCBI name for `taxa_id`
                    taxa_sname:
                      type: string
                      description: Abbreviation for `taxa_name`
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/taxa/{taxa_id}/chromosomes:
    get:
      tags:
        - assembly
      summary: Get chromosomes and their size
      description: >-
        Retrieve chromosomes and their size for the current assembly associated with a given taxon
      parameters:
        - in: path
          name: taxa_id
          required: true
          schema:
            type: integer
          description: A valid NCBI taxon
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    chrom:
                      type: string
                      description: Chromosome name
                    size:
                      type: integer
                      description: Chromosome size
        "400":
          description: Bad Request - invalid NCBI taxon
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "404":
          description: >-
            Not Found - NCBI taxon or chromosome data
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/taxa/{taxa_id}/assemblies:
    get:
      tags:
        - assembly
      summary: Get assemblies
      description: Retrieve available assemblies for the given taxon
      parameters:
        - in: path
          name: taxa_id
          required: true
          schema:
            type: integer
          description: A valid NCBI taxon
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Assembly identifier
                    name:
                      type: string
                      description: Assembly name
        "400":
          description: Bad Request - invalid NCBI taxon
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "404":
          description: Not Found - NCBI taxon
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/modomics:
    get:
      tags:
        - modification
      summary: Get modifications nomenclature
      description: Retrieve modifications annotated by MODOMICS
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: MODOMICS code
                    modomics_sname:
                      type: string
                      description: MODOMICS short name
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/methods:
    get:
      tags:
        - modification
      summary: Get detection methods
      description: Retrieve available detection methods and their classification
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Detection method identifier
                    cls:
                      type: string
                      description: Classification
                    meth:
                      type: string
                      description: Detection method
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/selections:
    get:
      tags:
        - content
      summary: Get selections
      description: Retrieve available combinations of modification, organism, and technology
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cls:
                      type: string
                      description: Detection method classification
                    cto:
                      type: string
                      description: Cell, tissue, or organism
                    domain:
                      type: string
                      description: Taxonomic domain
                    kingdom:
                      type: string
                      description: Taxonomic kingdom
                    meth:
                      type: string
                      description: Detection method
                    modification_id:
                      type: integer
                      description: Modification identifier (MODOMICS code, `rna`)
                    modomics_sname:
                      type: string
                      description: MODOMICS short name
                    organism_id:
                      type: integer
                      description: Organism identifier (`taxa_id`, `cto`)
                    rna:
                      type: string
                      description: RNA type
                    rna_name:
                      type: string
                      description: RNA type description
                    selection_id:
                      type: integer
                      description: Selection identifier
                    taxa_id:
                      type: integer
                      description: NCBI taxon
                    taxa_name:
                      type: string
                      description: NCBI name for `taxa_id`
                    taxa_sname:
                      type: string
                      description: Abbreviation for `taxa_name`
                    tech:
                      type: string
                      description: Detection technology
                    technology_id:
                      type: integer
                      description: Detection technology identifier (method identifier, `tech`)
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/genes:
    get:
      tags:
        - content
      summary: Get genes associated with selections
      description: >-
        Retrieve all genes associated with one or more given selection(s)
        (modification, organism, technology).
      parameters:
        - in: query
          name: selection
          required: true
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: One or more selection identifiers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Gene symbol
        "400":
          description: >-
            Bad Request - missing parameter(s) selection
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "404":
          description: Not Found - selection identifier
          content:
            application/json:
              schema:
                $ref: "_common.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  responses:
    InternalServerError:
      $ref: "_common.yaml#/components/responses/InternalServerError"
